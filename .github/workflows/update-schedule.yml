name: 更新赛程

on:
  schedule:
    # GitHub 使用 UTC：23:18 UTC = 北京时间 07:18；08:48 UTC = 北京时间 16:48
    - cron: '18 23 * * *'
    - cron: '48 8 * * *'
    # 备用时段：GitHub 定时任务偶尔会漏跑，多排两次（北京时间 12:18、22:18）
    - cron: '18 4 * * *'
    - cron: '18 14 * * *'
  workflow_dispatch:      # 可在 Actions 页面手动点 "Run workflow" 立即更新；网页"刷新"按钮会带 quick=true
    inputs:
      quick:
        description: '快速模式：只抓结构化接口，跳过 Gemini（约 20 秒）'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 抓取并整理赛程
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          QUICK: ${{ inputs.quick }}
        run: node scripts/update.mjs
      - name: 提交更新
        run: |
          if git diff --quiet -- data/schedule.json data/names.json; then
            echo "数据无变化"; exit 0
          fi
          git config user.name "game-on-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json data/names.json
          git commit -m "更新赛程 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          # 运行期间仓库可能有新提交：先同步再推送，最多重试 3 次
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
