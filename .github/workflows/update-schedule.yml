name: 更新赛程

on:
  schedule:
    # GitHub 使用 UTC：23:18 UTC = 北京时间 07:18；08:48 UTC = 北京时间 16:48
    - cron: '18 23 * * *'
    - cron: '48 8 * * *'
  workflow_dispatch: {}   # 可在 Actions 页面手动点 "Run workflow" 立即更新

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: 调用 Gemini 核对赛程
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/update.mjs
      - name: 提交更新
        run: |
          if git diff --quiet -- data/schedule.json; then
            echo "数据无变化"; exit 0
          fi
          git config user.name "game-on-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git commit -m "更新赛程 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push
